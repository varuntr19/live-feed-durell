<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Live Feed</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas" hidden></canvas>

  <div class="toolbar">
    <select id="cameraSelect" title="Camera" hidden></select>
    <button id="toggleBtn" title="Start camera">Start</button>
    <button id="flipBtn" title="Flip camera" disabled>Flip</button>
    <button id="snapshotBtn" title="Take snapshot" disabled>Snap</button>
  </div>

  <div id="status" class="toast"></div>

  <div id="snapshots" class="snapshot-strip"></div>

  <script src="app.js?v=2"></script>
</body>
</html>
